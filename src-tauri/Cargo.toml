[package]
name = "upnote2"
version = "0.1.0"
description = "Stash local-first notes"
license = "MIT"
edition = "2021"

[lib]
name = "upnote2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Isolated integration builds only. Requires an explicit fixture CA at build time.
sync-test-ca = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-stash-platform = { path = "plugins/stash-platform" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tauri-plugin-dialog = "2.7.1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
pulldown-cmark = "0.13"
pathdiff = "0.2"
percent-encoding = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"
security-framework = "3"
core-text = "20.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSCell", "NSGraphics", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSFontDescriptor", "NSView", "NSEvent"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"
